# Nightly lake sync (docs/DATA-PLATFORM.md): adds one settled day of Polymarket US full-game markets and price history
# to the R2 data lake. It does nothing until the owner adds the R2 repository secrets, so no data is collected before
# the lake exists. Read-only against Polymarket US; writes only to the owner's bucket.
name: Lake sync

on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:
    inputs:
      day:
        description: 'UTC day to add (YYYY-MM-DD). Default: two days ago.'
        required: false

permissions:
  contents: read

concurrency:
  group: lake-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_PUBLIC_BASE: ${{ secrets.R2_PUBLIC_BASE }}
      LAKE_PREFIX: ${{ secrets.LAKE_PREFIX }}
      DAY: ${{ inputs.day }}
    steps:
      - name: Check the lake is configured
        id: lake
        run: |
          if [ -z "$R2_ACCOUNT_ID" ] || [ -z "$R2_ACCESS_KEY_ID" ] || [ -z "$R2_SECRET_ACCESS_KEY" ] || [ -z "$R2_BUCKET" ]; then
            echo "R2 secrets are not set yet; nothing to sync."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.lake.outputs.ready == 'true'

      - uses: actions/setup-python@v5
        if: steps.lake.outputs.ready == 'true'
        with:
          python-version: '3.12'

      - name: Install lake tools
        if: steps.lake.outputs.ready == 'true'
        run: python -m pip install requests pandas pyarrow duckdb boto3

      - name: Self-test
        if: steps.lake.outputs.ready == 'true'
        run: python research/datastore/test_nightly.py

      - name: Sync one day
        if: steps.lake.outputs.ready == 'true'
        run: |
          if [ -z "$LAKE_PREFIX" ]; then export LAKE_PREFIX=dugout; fi
          if [ -n "$DAY" ]; then python research/datastore/nightly.py --day "$DAY"; else python research/datastore/nightly.py; fi
